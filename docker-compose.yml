version: '3.8'

services:
  endee-oss:
    image: endee-oss:latest
    container_name: endee-oss
    ports:
      - "8080:8080"
    environment:
      NDD_AUTH_TOKEN: ""
    volumes:
      - endee-data:/data
    restart: unless-stopped
    ulimits:
      nofile: 100000

  backend:
    build: 
      context: ./backend
    container_name: curatorai-backend
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - NDD_URL=http://endee-oss:8080/api/v1
    depends_on:
      - endee-oss
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # This tells the frontend container where the backend is running.
        # Ensure it maps to the backend port exposed above.
        - VITE_API_URL=http://localhost:8000
    container_name: curatorai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  endee-data:
